name: Grow commit koi

on:
  schedule:
    # 00:43 UTC / 06:13 IST; includes the last complete UTC day.
    - cron: "43 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/koi.yml"
      - "scripts/koi_commits.py"
      - "tests/test_koi_commits.py"

permissions:
  contents: read

concurrency:
  group: commit-koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check commit collection rules
        run: python3 -m unittest discover -s tests -v

      - name: Install Git Koi and collect public identity and languages
        uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          login: kanchanpotdar
          body: gold
          output-dir: ${{ runner.temp }}/koi-upstream

      - name: Collect public commits and render the commit koi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/koi_commits.py kanchanpotdar "$RUNNER_TEMP/koi-snapshot.json" \
            --output "$RUNNER_TEMP/koi-commits.json" --summary koi/stats.json
          git-koi render "$RUNNER_TEMP/koi-commits.json" --output-dir koi --body gold

      - name: Publish changed koi assets as the bot
        run: |
          git add koi/koi.gif koi/koi.png koi/stats.json
          if git diff --cached --quiet; then
            echo "The koi is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update commit koi [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
