<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Animated current projects</title>
  <desc id="desc">Four practical AI and data projects with animated retro progress strips.</desc>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .card { animation: cardTap 6.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }.p2 { animation-delay:.5s }.p3 { animation-delay:1s }.p4 { animation-delay:1.5s }
    .bar { animation: fillBar 5.4s ease-in-out infinite; transform-origin:left; }.b2 { animation-delay:.4s }.b3 { animation-delay:.8s }.b4 { animation-delay:1.2s }
    .arrow { animation: arrowMove 1.8s steps(2,end) infinite; }
    @keyframes cardTap { 0%,100%{transform:translateY(0)} 48%,54%{transform:translateY(-4px)} }
    @keyframes fillBar { 0%,10%{transform:scaleX(.08)} 52%,85%{transform:scaleX(1)} 100%{transform:scaleX(.08)} }
    @keyframes arrowMove { 0%,100%{transform:translateX(0)} 50%{transform:translateX(10px)} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="1200" height="540" rx="10" fill="#C9362B"/><text x="42" y="66" class="sans" font-size="36" font-weight="800" fill="#F2C94C">CURRENT PROJECTS</text><text x="1158" y="64" text-anchor="end" class="sans arrow" font-size="22" font-weight="800" fill="#FFF4CC">BUILD →</text>
  <g class="card"><rect x="42" y="102" width="535" height="176" rx="6" fill="#F2C94C"/><text x="70" y="148" class="sans" font-size="17" font-weight="800" fill="#C9362B">01 · AGENTIC AI</text><text x="70" y="196" class="sans" font-size="30" font-weight="800" fill="#8F211A">FINANCIAL RESEARCH</text><text x="70" y="231" class="sans" font-size="18" fill="#8F211A">Multi-agent analysis · bull/bear debate</text><rect x="70" y="249" width="470" height="8" fill="#FFF4CC"/><rect class="bar" x="70" y="249" width="470" height="8" fill="#C9362B"/></g>
  <g class="card p2"><rect x="623" y="102" width="535" height="176" rx="6" fill="#F2C94C"/><text x="651" y="148" class="sans" font-size="17" font-weight="800" fill="#C9362B">02 · DATA ENGINEERING</text><text x="651" y="196" class="sans" font-size="30" font-weight="800" fill="#8F211A">OPENAQ MEDALLION</text><text x="651" y="231" class="sans" font-size="18" fill="#8F211A">3.3M rows · auditable Bronze → Gold</text><rect x="651" y="249" width="470" height="8" fill="#FFF4CC"/><rect class="bar b2" x="651" y="249" width="470" height="8" fill="#C9362B"/></g>
  <g class="card p3"><rect x="42" y="312" width="535" height="176" rx="6" fill="#F2C94C"/><text x="70" y="358" class="sans" font-size="17" font-weight="800" fill="#C9362B">03 · RETRIEVAL</text><text x="70" y="406" class="sans" font-size="30" font-weight="800" fill="#8F211A">INVESTMENT RAG</text><text x="70" y="441" class="sans" font-size="18" fill="#8F211A">Hybrid search · reranking · citations</text><rect x="70" y="459" width="470" height="8" fill="#FFF4CC"/><rect class="bar b3" x="70" y="459" width="470" height="8" fill="#C9362B"/></g>
  <g class="card p4"><rect x="623" y="312" width="535" height="176" rx="6" fill="#F2C94C"/><text x="651" y="358" class="sans" font-size="17" font-weight="800" fill="#C9362B">04 · SIMULATION</text><text x="651" y="406" class="sans" font-size="30" font-weight="800" fill="#8F211A">CRICKET MONTE CARLO</text><text x="651" y="441" class="sans" font-size="18" fill="#8F211A">Ball-by-ball Markov match engine</text><rect x="651" y="459" width="470" height="8" fill="#FFF4CC"/><rect class="bar b4" x="651" y="459" width="470" height="8" fill="#C9362B"/></g>
</svg>
