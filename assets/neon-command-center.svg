<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Kanchan Potdar glass command center</title>
  <desc id="desc">Animated neon glass interface in midnight blue and chartreuse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09152A"/><stop offset=".55" stop-color="#132441"/><stop offset="1" stop-color="#1D3558"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2FF93"/><stop offset="1" stop-color="#DAF561"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#DAF561" stop-opacity=".05"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#DAF561" stop-opacity=".62"/><stop offset="1" stop-color="#DAF561" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#DAF561" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity=".65"/></filter>
    <clipPath id="clip"><rect x="8" y="8" width="1184" height="374" rx="30"/></clipPath>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tiny{font-size:16px;letter-spacing:3px}.label{font-size:14px;font-weight:700;letter-spacing:3px}.blink{animation:blink 1.15s steps(1) infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.spin{transform-origin:1017px 190px;animation:spin 17s linear infinite}.float{animation:float 4.5s ease-in-out infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-7px)}}</style>
  </defs>
  <rect width="1200" height="390" rx="34" fill="#07101F"/>
  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="1184" height="374" rx="30" fill="url(#bg)"/>
    <rect x="8" y="8" width="1184" height="374" fill="url(#grid)"/>
    <circle cx="1030" cy="190" r="230" fill="url(#halo)" opacity=".52"/>
    <path d="M-40 330C210 245 340 390 620 282S994 307 1245 190V430H-40Z" fill="#DAF561" opacity=".13"/>
    <path d="M-20 331C220 246 354 390 622 282S995 306 1225 201" fill="none" stroke="#DAF561" stroke-width="3" stroke-opacity=".68"/>
    <g filter="url(#shadow)">
      <rect x="48" y="43" width="700" height="291" rx="27" fill="url(#glass)" stroke="#DAF561" stroke-opacity=".52"/>
      <rect x="777" y="43" width="365" height="291" rx="27" fill="#0A1629" fill-opacity=".68" stroke="#DAF561" stroke-opacity=".72"/>
    </g>
    <g class="mono">
      <rect x="80" y="77" width="173" height="31" rx="15.5" fill="#DAF561"/>
      <circle cx="98" cy="92.5" r="5" fill="#132441" class="pulse"/>
      <text x="113" y="98" font-size="12" font-weight="800" letter-spacing="2" fill="#132441">SYSTEM ONLINE</text>
      <text x="78" y="172" font-size="66" font-weight="900" letter-spacing="2" fill="#F9FBFF">KANCHAN</text>
      <text x="78" y="236" font-size="66" font-weight="900" letter-spacing="2" fill="url(#yellow)" filter="url(#glow)">POTDAR</text>
      <text x="82" y="273" class="label" fill="#DAF561">APPLIED AI  ·  DATA SYSTEMS  ·  QUANT</text>
      <rect x="82" y="294" width="505" height="2" fill="#DAF561" opacity=".5"/>
      <text x="82" y="318" class="tiny" fill="#C9D6E7">DESIGNING RELIABLE INTELLIGENCE</text>
      <rect x="443" y="305" width="10" height="17" fill="#DAF561" class="blink"/>
    </g>
    <g class="float">
      <circle cx="1017" cy="190" r="102" fill="#DAF561" fill-opacity=".08" stroke="#DAF561" stroke-width="2"/>
      <circle cx="1017" cy="190" r="82" fill="#0A1629" fill-opacity=".72" stroke="#DAF561" stroke-opacity=".85"/>
      <g class="spin"><circle cx="1017" cy="190" r="94" fill="none" stroke="#DAF561" stroke-width="6" stroke-dasharray="12 15" filter="url(#glow)"/></g>
      <path d="M1017 128L1071 159V221L1017 252L963 221V159Z" fill="url(#glass)" stroke="#DAF561" stroke-width="2"/>
      <path d="M978 211L1000 166L1018 204L1037 155L1058 211Z" fill="url(#yellow)" filter="url(#glow)"/>
      <circle cx="1017" cy="190" r="9" fill="#132441" stroke="#DAF561" stroke-width="3"/>
    </g>
    <g class="mono"><text x="815" y="83" class="tiny" fill="#DAF561">GLASS // AI CORE</text><text x="817" y="305" class="tiny" fill="#F9FBFF">IIT KHARAGPUR</text><circle cx="1108" cy="301" r="6" fill="#DAF561" class="pulse"/></g>
    <path d="M24 67V25H66M1134 25H1176V67M24 323V365H66M1134 365H1176V323" fill="none" stroke="#DAF561" stroke-width="3"/>
    <rect x="8" y="8" width="1184" height="3" fill="#DAF561" opacity=".75"><animate attributeName="y" values="8;379;8" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.75;.05" dur="8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="8" y="8" width="1184" height="374" rx="30" fill="none" stroke="#DAF561" stroke-width="2"/>
</svg>
