<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kanchan Potdar neon command center</title>
  <desc id="desc">An animated midnight blue and chartreuse player HUD introducing Kanchan Potdar.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#DAF561" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DAF561" stop-opacity="0"/>
      <stop offset=".5" stop-color="#DAF561" stop-opacity=".9"/>
      <stop offset="1" stop-color="#DAF561" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="18" y="18" width="1164" height="384" rx="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 13px; letter-spacing: 3px; fill: #DAF561; }
      .value { font-size: 17px; letter-spacing: 1px; fill: #F6F8FF; }
      .micro { font-size: 11px; letter-spacing: 2px; fill: #91A8C6; }
      .dash { stroke-dasharray: 8 10; animation: march 9s linear infinite; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes march { to { stroke-dashoffset: -180; } }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes blink { 50% { opacity:0 } }
      @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#0A1426"/>
  <rect x="10" y="10" width="1180" height="400" rx="24" fill="#132441" stroke="#DAF561" stroke-opacity=".75" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="18" y="18" width="1164" height="384" fill="url(#grid)"/>
    <path d="M18 322L245 286L432 326L664 274L906 315L1182 250V402H18Z" fill="#DAF561" opacity=".035"/>
    <path d="M18 322L245 286L432 326L664 274L906 315L1182 250" fill="none" stroke="#DAF561" stroke-opacity=".23" stroke-width="2"/>

    <g opacity=".72">
      <circle cx="1032" cy="196" r="102" fill="none" stroke="#DAF561" stroke-opacity=".13" stroke-width="24"/>
      <circle cx="1032" cy="196" r="102" fill="none" stroke="#DAF561" stroke-width="4" stroke-dasharray="240 401" class="dash" filter="url(#softGlow)"/>
      <circle cx="1032" cy="196" r="71" fill="#DAF561" fill-opacity=".035" stroke="#DAF561" stroke-opacity=".5" class="float"/>
      <path d="M1032 133L1087 164V228L1032 259L977 228V164Z" fill="none" stroke="#DAF561" stroke-width="2"/>
      <path d="M1002 213L1022 176L1041 205L1057 179L1070 213Z" fill="#DAF561" opacity=".95" filter="url(#glow)"/>
      <circle cx="1032" cy="196" r="8" fill="#132441" stroke="#DAF561" stroke-width="2" class="pulse"/>
    </g>

    <g opacity=".85">
      <path d="M41 82V42H81M1119 42H1159V82M41 338V378H81M1119 378H1159V338" fill="none" stroke="#DAF561" stroke-width="3"/>
      <path d="M63 62H925" stroke="#DAF561" stroke-opacity=".22" class="dash"/>
      <path d="M63 357H924" stroke="#DAF561" stroke-opacity=".22" class="dash"/>
    </g>

    <g class="mono">
      <text x="72" y="102" class="label">PLAYER // 01</text>
      <text x="69" y="173" font-size="61" font-weight="800" letter-spacing="3" fill="#F6F8FF">KANCHAN</text>
      <text x="69" y="232" font-size="61" font-weight="800" letter-spacing="3" fill="#DAF561" filter="url(#softGlow)">POTDAR</text>
      <text x="73" y="270" font-size="15" letter-spacing="4" fill="#91A8C6">APPLIED AI · DATA SYSTEMS · QUANT RESEARCH</text>
      <rect x="72" y="291" width="535" height="2" fill="url(#fade)"/>

      <g transform="translate(72 318)">
        <circle cx="6" cy="-5" r="5" fill="#DAF561" class="pulse" filter="url(#softGlow)"/>
        <text x="22" y="0" class="label">STATUS</text>
        <text x="105" y="0" class="value">BUILDING THE NEXT SYSTEM</text>
        <rect x="382" y="-15" width="9" height="18" fill="#DAF561" class="blink"/>
      </g>

      <g transform="translate(805 92)">
        <text x="0" y="0" class="micro">LOADOUT</text>
        <text x="0" y="31" class="label">PYTHON</text><rect x="93" y="18" width="86" height="8" rx="4" fill="#0A1426"/><rect x="93" y="18" width="79" height="8" rx="4" fill="#DAF561"/>
        <text x="0" y="61" class="label">ML / AI</text><rect x="93" y="48" width="86" height="8" rx="4" fill="#0A1426"/><rect x="93" y="48" width="75" height="8" rx="4" fill="#DAF561"/>
        <text x="0" y="91" class="label">DATA</text><rect x="93" y="78" width="86" height="8" rx="4" fill="#0A1426"/><rect x="93" y="78" width="70" height="8" rx="4" fill="#DAF561"/>
      </g>

      <g transform="translate(806 314)">
        <text x="0" y="0" class="micro">BASE // IIT KHARAGPUR</text>
        <text x="0" y="28" class="micro">MODE // DEEP WORK</text>
      </g>
    </g>

    <rect x="18" y="18" width="1164" height="3" fill="#DAF561" opacity=".8">
      <animate attributeName="y" values="18;399;18" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".05;.65;.05" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
