<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Kanchan Potdar visual player profile</title><desc id="d">Glass profile card with role, focus and current mission.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#132441"/><stop offset="1" stop-color="#07101F"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".2"/><stop offset="1" stop-color="#DAF561" stop-opacity=".04"/></linearGradient><radialGradient id="halo"><stop stop-color="#DAF561" stop-opacity=".8"/><stop offset="1" stop-color="#DAF561" stop-opacity="0"/></radialGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".6"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DAF561" opacity=".14"/></pattern><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.pulse{animation:p 2s ease-in-out infinite}.float{animation:f 4s ease-in-out infinite}@keyframes p{50%{opacity:.25}}@keyframes f{50%{transform:translateY(-5px)}}</style>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/><rect width="1200" height="360" rx="30" fill="url(#dots)"/><circle cx="145" cy="180" r="170" fill="url(#halo)" opacity=".38"/>
  <g filter="url(#shadow)"><rect x="34" y="31" width="284" height="298" rx="28" fill="#DAF561" fill-opacity=".16" stroke="#DAF561" stroke-width="2"/><rect x="342" y="31" width="507" height="298" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".24"/><rect x="873" y="31" width="293" height="298" rx="28" fill="#DAF561" fill-opacity=".92"/></g>
  <g class="float"><circle cx="176" cy="148" r="86" fill="#132441" stroke="#DAF561" stroke-width="3" filter="url(#glow)"/><circle cx="176" cy="148" r="66" fill="none" stroke="#DAF561" stroke-opacity=".45" stroke-dasharray="8 9"/><text x="176" y="170" text-anchor="middle" class="m" font-size="58" font-weight="900" fill="#DAF561">KP</text></g>
  <g class="m">
    <rect x="73" y="253" width="205" height="39" rx="19" fill="#DAF561"/><circle cx="95" cy="272.5" r="6" fill="#132441" class="pulse"/><text x="111" y="278" font-size="13" font-weight="900" letter-spacing="2" fill="#132441">AVAILABLE TO BUILD</text>
    <text x="383" y="79" font-size="12" letter-spacing="3" fill="#DAF561">PLAYER PROFILE // VISUAL MODE</text><text x="382" y="131" font-size="33" font-weight="900" fill="#FFFFFF">APPLIED AI BUILDER</text><text x="382" y="165" font-size="15" letter-spacing="2" fill="#DAF561">DATA · RESEARCH · PRODUCT</text><path d="M382 190H806" stroke="#DAF561" stroke-opacity=".45"/>
    <g transform="translate(382 217)"><circle cx="18" cy="18" r="18" fill="#DAF561" fill-opacity=".18" stroke="#DAF561"/><path d="M10 18L16 24L27 11" fill="none" stroke="#DAF561" stroke-width="3"/><text x="49" y="13" font-size="12" letter-spacing="2" fill="#AFC0D6">BUILDS</text><text x="49" y="32" font-size="15" fill="#FFFFFF">Grounded, auditable AI systems</text></g>
    <g transform="translate(382 273)"><circle cx="18" cy="18" r="18" fill="#DAF561" fill-opacity=".18" stroke="#DAF561"/><path d="M11 23L18 10L25 23Z" fill="#DAF561"/><text x="49" y="13" font-size="12" letter-spacing="2" fill="#AFC0D6">BASE</text><text x="49" y="32" font-size="15" fill="#FFFFFF">IIT Kharagpur</text></g>
    <text x="909" y="78" font-size="12" letter-spacing="3" font-weight="800" fill="#132441">CURRENT MISSION</text><text x="909" y="125" font-size="26" font-weight="900" fill="#132441">MAKE AI</text><text x="909" y="158" font-size="26" font-weight="900" fill="#132441">USEFUL.</text><text x="909" y="191" font-size="26" font-weight="900" fill="#132441">TESTABLE.</text><text x="909" y="224" font-size="26" font-weight="900" fill="#132441">REAL.</text><path d="M909 252H1129" stroke="#132441" stroke-width="2" opacity=".4"/><text x="909" y="280" font-size="12" letter-spacing="2" fill="#132441">MODE // DEEP WORK</text><text x="909" y="307" font-size="12" letter-spacing="2" fill="#132441">STATUS // SHIPPING</text>
  </g>
