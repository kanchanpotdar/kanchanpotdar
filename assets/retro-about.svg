<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Animated story of Kanchan's work</title>
  <desc id="desc">Education, research experience, and practical AI focus connected as a moving retro timeline.</desc>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .card { animation: cardRise 6s ease-in-out infinite; }.c2 { animation-delay:.35s; }.c3 { animation-delay:.7s; }
    .runner { animation: run 6s linear infinite; }.dash { stroke-dasharray:12 10; animation: dash 3s linear infinite; }
    @keyframes cardRise { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes run { 0%{transform:translateX(0)} 100%{transform:translateX(1028px)} }
    @keyframes dash { to{stroke-dashoffset:-44} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="1200" height="380" rx="10" fill="#C9362B"/>
  <text x="42" y="64" class="sans" font-size="34" font-weight="800" fill="#F2C94C">MECHANICAL ROOTS. PRACTICAL AI.</text>
  <path class="dash" d="M78 101H1122" stroke="#F2C94C" stroke-width="4"/><rect class="runner" x="72" y="94" width="28" height="18" fill="#FFF4CC"/>
  <g class="card"><rect x="42" y="126" width="350" height="210" rx="6" fill="#B92F25" stroke="#F2C94C" stroke-width="3"/><text x="70" y="169" class="sans" font-size="16" font-weight="800" fill="#F2C94C" letter-spacing="1.5">01 / EDUCATION</text><text x="70" y="215" class="sans" font-size="27" font-weight="800" fill="#FFF4CC">IIT KHARAGPUR</text><text x="70" y="254" class="sans" font-size="18" fill="#FFF4CC">Fourth-Year Mechanical</text><text x="70" y="281" class="sans" font-size="18" fill="#FFF4CC">Engineering Student</text><rect x="70" y="305" width="220" height="7" fill="#F2C94C"/></g>
  <g class="card c2"><rect x="425" y="126" width="350" height="210" rx="6" fill="#B92F25" stroke="#F2C94C" stroke-width="3"/><text x="453" y="169" class="sans" font-size="16" font-weight="800" fill="#F2C94C" letter-spacing="1.5">02 / RESEARCH</text><text x="453" y="215" class="sans" font-size="27" font-weight="800" fill="#FFF4CC">ISI KOLKATA</text><text x="453" y="254" class="sans" font-size="18" fill="#FFF4CC">Remaining Useful Life</text><text x="453" y="281" class="sans" font-size="18" fill="#FFF4CC">Time-Series Reliability</text><rect x="453" y="305" width="260" height="7" fill="#F2C94C"/></g>
  <g class="card c3"><rect x="808" y="126" width="350" height="210" rx="6" fill="#B92F25" stroke="#F2C94C" stroke-width="3"/><text x="836" y="169" class="sans" font-size="16" font-weight="800" fill="#F2C94C" letter-spacing="1.5">03 / BUILD FOCUS</text><text x="836" y="215" class="sans" font-size="27" font-weight="800" fill="#FFF4CC">PRACTICAL AI</text><text x="836" y="254" class="sans" font-size="18" fill="#FFF4CC">LLMs · Agentic Workflows</text><text x="836" y="281" class="sans" font-size="18" fill="#FFF4CC">ML · Data Engineering</text><rect x="836" y="305" width="294" height="7" fill="#F2C94C"/></g>
</svg>
