<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated identity profile</title>
  <desc id="desc">Kanchan Potdar, Applied AI Builder at IIT Kharagpur, with a quietly animated focus meter.</desc>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .stamp { animation: stamp 5s ease-in-out infinite; transform-origin:242px 63px; }
    .meter { animation: meter 5.8s ease-in-out infinite; transform-origin:left; }
    .meter.m2 { animation-delay:.45s; }.meter.m3 { animation-delay:.9s; }
    .cursor { animation: cursor 1.1s steps(1,end) infinite; }
    @keyframes stamp { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-1.2deg)} }
    @keyframes meter { 0%,12%{transform:scaleX(.08)} 48%,82%{transform:scaleX(1)} 100%{transform:scaleX(.08)} }
    @keyframes cursor { 0%,45%{opacity:1} 46%,100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="1200" height="320" rx="10" fill="#C9362B"/>
  <g class="stamp"><rect x="38" y="34" width="408" height="58" rx="4" fill="#F2C94C"/><text x="62" y="73" class="sans" font-size="30" font-weight="800" fill="#8F211A">APPLIED AI BUILDER</text></g>
  <text x="42" y="157" class="sans" font-size="46" font-weight="800" fill="#FFF4CC">KANCHAN POTDAR<tspan class="cursor" fill="#F2C94C">_</tspan></text>
  <text x="44" y="207" class="sans" font-size="24" font-weight="700" fill="#F2C94C">Data · Research · Agentic AI</text>
  <text x="44" y="252" class="sans" font-size="14" font-weight="800" fill="#FFF4CC" letter-spacing="1.4">CURRENT FOCUS</text>
  <rect x="44" y="268" width="176" height="8" fill="#8F211A"/><rect class="meter" x="44" y="268" width="176" height="8" fill="#F2C94C"/>
  <rect x="236" y="268" width="176" height="8" fill="#8F211A"/><rect class="meter m2" x="236" y="268" width="176" height="8" fill="#F2C94C"/>
  <rect x="428" y="268" width="176" height="8" fill="#8F211A"/><rect class="meter m3" x="428" y="268" width="176" height="8" fill="#F2C94C"/>
  <text x="44" y="298" class="sans" font-size="13" fill="#FFF4CC">LLM SYSTEMS</text><text x="236" y="298" class="sans" font-size="13" fill="#FFF4CC">DATA PRODUCTS</text><text x="428" y="298" class="sans" font-size="13" fill="#FFF4CC">MACHINE LEARNING</text>
  <rect x="735" y="46" width="425" height="228" rx="6" fill="#F2C94C"/>
  <text x="770" y="101" class="sans" font-size="18" font-weight="700" fill="#8F211A">EDUCATION</text>
  <text x="770" y="148" class="sans" font-size="29" font-weight="800" fill="#C9362B">IIT KHARAGPUR</text>
  <text x="770" y="191" class="sans" font-size="20" font-weight="700" fill="#8F211A">FOURTH-YEAR MECHANICAL</text>
  <text x="770" y="221" class="sans" font-size="20" font-weight="700" fill="#8F211A">ENGINEERING STUDENT</text>
  <rect x="770" y="241" width="350" height="5" fill="#C9362B"/><rect class="meter m2" x="770" y="241" width="350" height="5" fill="#8F211A"/>
</svg>
