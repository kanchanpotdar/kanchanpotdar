<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Identity core — Applied AI Builder</title>
  <desc id="desc">Kanchan Potdar's player profile and university identity.</desc>
  <defs>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#EDF2F6" stop-opacity=".14"/><stop offset="1" stop-color="#DBFE01" stop-opacity=".025"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#DBFE01" stop-opacity=".52"/><stop offset="1" stop-color="#DBFE01" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#EDF2F6" opacity=".08"/></pattern>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.pulse{animation:p 2s ease-in-out infinite}.float{animation:f 4s ease-in-out infinite}@keyframes p{50%{opacity:.25}}@keyframes f{50%{transform:translateY(-5px)}}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="30" fill="url(#glass)" stroke="#EDF2F6" stroke-opacity=".2"/><rect x="1" y="1" width="1198" height="358" rx="30" fill="url(#dots)"/>
  <circle cx="178" cy="156" r="142" fill="url(#halo)" opacity=".45"/>
  <rect x="34" y="31" width="284" height="298" rx="28" fill="#DBFE01" fill-opacity=".07" stroke="#DBFE01" stroke-width="2"/>
  <rect x="342" y="31" width="507" height="298" rx="28" fill="url(#glass)" stroke="#EDF2F6" stroke-opacity=".24"/>
  <rect x="873" y="31" width="293" height="298" rx="28" fill="#FF2801" fill-opacity=".08" stroke="#FF2801" stroke-width="2"/>
  <g class="float"><circle cx="176" cy="145" r="86" fill="#EDF2F6" fill-opacity=".035" stroke="#DBFE01" stroke-width="3" filter="url(#glow)"/><circle cx="176" cy="145" r="66" fill="none" stroke="#FF2801" stroke-opacity=".85" stroke-dasharray="8 9"/><text x="176" y="167" text-anchor="middle" class="m" font-size="58" font-weight="900" fill="#EDF2F6">KP</text></g>
  <g class="m"><rect x="72" y="250" width="207" height="40" rx="20" fill="#DBFE01" fill-opacity=".14" stroke="#DBFE01"/><circle cx="95" cy="270" r="6" fill="#FF2801" class="pulse"/><text x="111" y="276" font-size="13" font-weight="900" letter-spacing="2" fill="#DBFE01">AVAILABLE TO BUILD</text>
    <text x="383" y="79" font-size="12" letter-spacing="3" fill="#FF2801">IDENTITY CORE // PLAYER 01</text><text x="382" y="131" font-size="33" font-weight="900" fill="#EDF2F6">APPLIED AI BUILDER</text><text x="382" y="165" font-size="15" letter-spacing="2" fill="#DBFE01">DATA · RESEARCH · AGENTIC AI</text><path d="M382 190H806" stroke="#FF2801" stroke-opacity=".7"/>
    <g transform="translate(382 211)"><circle cx="18" cy="18" r="18" fill="#DBFE01" fill-opacity=".1" stroke="#DBFE01"/><path d="M10 18L16 24L27 11" fill="none" stroke="#DBFE01" stroke-width="3"/><text x="49" y="13" font-size="11" letter-spacing="2" fill="#FF2801">BUILDS</text><text x="49" y="32" font-size="15" fill="#EDF2F6">Grounded, auditable AI systems</text></g>
    <g transform="translate(382 267)"><circle cx="18" cy="18" r="18" fill="#FF2801" fill-opacity=".1" stroke="#FF2801"/><path d="M11 23L18 10L25 23Z" fill="none" stroke="#FF2801" stroke-width="3"/><text x="49" y="11" font-size="11" letter-spacing="2" fill="#FF2801">EDUCATION</text><text x="49" y="31" font-size="14" font-weight="800" fill="#EDF2F6">Fourth-Year Mechanical Engineering</text></g>
    <text x="909" y="76" font-size="12" letter-spacing="3" font-weight="800" fill="#FF2801">IIT KHARAGPUR</text><text x="909" y="122" font-size="25" font-weight="900" fill="#EDF2F6">FOURTH-YEAR</text><text x="909" y="155" font-size="25" font-weight="900" fill="#EDF2F6">MECHANICAL</text><text x="909" y="188" font-size="25" font-weight="900" fill="#EDF2F6">ENGINEERING</text><text x="909" y="221" font-size="25" font-weight="900" fill="#DBFE01">STUDENT</text><path d="M909 249H1129" stroke="#FF2801" stroke-width="2" opacity=".8"/><text x="909" y="279" font-size="12" letter-spacing="2" fill="#EDF2F6">FOCUS // PRACTICAL AI</text><text x="909" y="306" font-size="12" letter-spacing="2" fill="#DBFE01">STATUS // SHIPPING</text>
  </g>
</svg>

